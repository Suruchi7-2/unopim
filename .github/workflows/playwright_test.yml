name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 👇 Added: detect file changes for selective testing
      - name: Detect file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            product:
              - 'packages/Webkul/Product/**'
              - 'tests/e2e-pw/**/product*.spec.js'
            attribute:
              - 'packages/Webkul/Attribute/**'
              - 'tests/e2e-pw/**/attribute*.spec.js'
            catalog:
              - 'packages/Webkul/Category/**'
              - 'tests/e2e-pw/tests/catalog/**'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 👇 Replaced: single test run with conditional runs
      - name: Run Product tests
        if: steps.changes.outputs.product == 'true'
        run: |
          cd tests/e2e-pw
          npx playwright test **/product*.spec.js --reporter=list

      - name: Run Attribute tests
        if: steps.changes.outputs.attribute == 'true'
        run: |
          cd tests/e2e-pw
          npx playwright test **/attribute*.spec.js --reporter=list

      - name: Run Catalog tests
        if: steps.changes.outputs.catalog == 'true'
        run: |
          cd tests/e2e-pw
          npx playwright test tests/catalog/ --reporter=list

      - name: Run all tests (fallback)
        if: steps.changes.outputs.product != 'true' && steps.changes.outputs.attribute != 'true' && steps.changes.outputs.catalog != 'true'
        run: |
          cd tests/e2e-pw
          npx playwright test --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e-pw/playwright-report
